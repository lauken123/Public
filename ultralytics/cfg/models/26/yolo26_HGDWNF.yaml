nc: 9  # 修改為你數據集的實際類別數

scales: 
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO-Pest-Ultimate (融合 DWT + NoiseFilteredFusion + HGConv + C2PSA)
backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2 (320x320)
  - [-1, 1, DWTDownsample, [128]]      # 1-P2/4 (160x160) -> 引入 DWT 下採樣
  - [-1, 3, C2f, [128, True]]          # 2
  #- [-1, 2, C3k2,  [128, True, 0.25]]    # 2
  - [-1, 1, DWTDownsample, [256]]      # 3-P3/8 (80x80)   -> 引入 DWT 下採樣
  - [-1, 6, C2f, [256, True]]          # 4
  #- [-1, 2, C3k2,  [256, True, 0.25]]    # 4 -> Backbone P3 输出
  - [-1, 1, DWTDownsample, [512]]      # 5-P4/16 (40x40)  -> 引入 DWT 下採樣
  - [-1, 6, C2f, [512, True]]          # 6
  #- [-1, 4, A2C2f, [512, True, 4]]       # 6 -> Backbone P4 初始特征
  - [-1, 1, HGConv, [1024]]            # 7-保持 40x40      -> 引入 HGConv 通道注意力
  - [-1, 1, DWTDownsample, [1024]]     # 8-下採樣到 20x20  -> 引入 DWT 下採樣
  - [-1, 3, C2f, [1024, True]]         # 9
  #- [-1, 1, Conv,  [1024, 3, 2]]         # 8-P5/32 
  #- [-1, 4, A2C2f, [1024, True, 1]]      # 9
  - [-1, 1, SPPF, [1024, 5]]           # 10-P5/32 (20x20)
  - [-1, 2, C2PSA, [1024]]             # 11-P5/32 (20x20) -> 核心 C2PSA 模組

head:
  # --- P4 (40x40) 自頂向下路徑 ---
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 12 (20x20 -> 40x40)
  - [[-1, 7], 1, NoiseFilteredFusion, []]      # 13 融合深層特徵與第 7 層 (HGConv)
  #- [-1, 3, C3k2, [512]]                       # 14
  - [-1, 2, A2C2f, [512, False, -1]]            # 13

  # --- P3 (80x80) 自頂向下路徑 ---
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 15 (40x40 -> 80x80)
  - [[-1, 4], 1, NoiseFilteredFusion, []]      # 16 融合深層特徵與第 4 層 (C2f)
  #- [-1, 3, C3k2, [256]]                       # 17
  - [-1, 2, A2C2f, [256, False, -1]]            # 16 -> Head P3 输出

  # --- P2 (160x160) 自頂向下路徑 ---
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 18 (80x80 -> 160x160)
  - [[-1, 2], 1, NoiseFilteredFusion, []]      # 19 融合深層特徵與第 2 層 (C2f)
  #- [-1, 3, C3k2, [128]]                       # 20 (P2 輸出)
  - [-1, 2, A2C2f, [256, False, -1]]            # 19 -> Head P2 输出

  # --- P3 回傳融合路徑 (自底向上) ---
  - [-1, 1, DWTDownsample, [128]]              # 21 (160x160 -> 80x80) 用 DWT 代替傳統卷積
  - [[-1, 17], 1, NoiseFilteredFusion, []]     # 22
  #- [-1, 3, C3k2, [256]]                       # 23 (P3 輸出)
  - [-1, 2, A2C2f, [256, False, -1]]            # 22

  # --- P4 回傳融合路徑 (自底向上) ---
  - [-1, 1, DWTDownsample, [256]]              # 24 (80x80 -> 40x40) 用 DWT 代替傳統卷積
  - [[-1, 14], 1, NoiseFilteredFusion, []]     # 25
  #- [-1, 3, C3k2, [512]]                       # 26 (P4 輸出)
  - [-1, 2, A2C2f, [512, False, -1]]            # 25

  # --- P5 回傳融合路徑 (自底向上) ---
  - [-1, 1, DWTDownsample, [512]]              # 27 (40x40 -> 20x20) 用 DWT 代替傳統卷積
  - [[-1, 11], 1, NoiseFilteredFusion, []]     # 28 【重大修復】：精準與第 11 層的 C2PSA 融合！
  - [-1, 3, C3k2, [1024]]                      # 29 (P5 輸出)

  # 檢測頭輸入
  - [[20, 23, 26, 29], 1, Detect, [nc]]        # 30